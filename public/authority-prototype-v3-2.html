<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Authority Journey v3.2 — Counterfactual Allocation FIELD</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;background:#f6f6f3;color:#171717;line-height:1.5}*{box-sizing:border-box}body{margin:0}.shell{max-width:920px;margin:auto;padding:22px 16px 76px}.lab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #bbb;padding:8px 0 14px;margin-bottom:28px;font-size:12px;color:#666}.progress{height:4px;background:#ddd;margin-bottom:26px}.progress i{height:100%;display:block;background:#222}.panel{background:#fff;border:2px solid #222;padding:28px;margin-bottom:14px}.soft{border:1px solid #aaa}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:#666;margin-bottom:8px}h1{font-size:34px;line-height:1.12;margin:0 0 14px}h2{font-size:25px;line-height:1.2;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0 14px}.lead{font-size:19px}.muted{color:#666}.small{font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button{font:inherit;font-weight:700;padding:11px 15px;border:2px solid #222;background:#222;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#222}button.choice{display:block;width:100%;text-align:right;background:#fff;color:#222;padding:15px;margin:8px 0}button.choice strong,button.choice span{display:block}button.choice span{font-weight:400;color:#555;margin-top:3px}.recommended{border-width:3px!important}.tag{display:inline-block;border:1px solid #777;padding:3px 7px;font-size:12px;margin-left:6px}.summary{border-right:5px solid #222;padding-right:14px;margin:18px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.node{border:2px solid #222;padding:13px;margin:8px 0}.parallel{margin-right:28px;border-style:dashed}.blocked{border-color:#999;background:#f1f1ef;color:#666}.premature{border:3px double #888;color:#666}.delta{border:2px solid #222;padding:16px;margin:10px 0}.delta.keep{border-style:solid}.delta.delay{border-style:dashed}.delta.reduce{border-style:dotted}.delta.add{border-width:4px}.why{border-top:1px solid #bbb;margin-top:14px;padding-top:14px}.hidden{display:none}.tester{margin-top:40px;border-top:1px dashed #999;padding-top:18px;font-size:13px;color:#666}select,input,textarea{width:100%;font:inherit;padding:12px;border:2px solid #222;background:#fff}textarea{min-height:86px}.tester select{border:1px solid #aaa}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:5px}.planrow{display:grid;grid-template-columns:2.4fr .7fr .8fr .8fr;gap:8px;margin:10px 0;align-items:end}.planrow label{font-size:12px;color:#666}.planrow input,.planrow select{margin-top:4px}.baseline{border:1px solid #aaa;padding:12px;margin:8px 0}.money{font-variant-numeric:tabular-nums}.allocation-summary{background:#f1f1ef;border:1px solid #888;padding:14px;margin:16px 0}.warning{border-right:5px solid #777;padding-right:12px}.recall li{margin-bottom:8px}@media(max-width:700px){.shell{padding:14px 11px 56px}.panel{padding:20px 16px}h1{font-size:29px}.cols{grid-template-columns:1fr}.planrow{grid-template-columns:1fr 1fr}.planrow .actionfield{grid-column:1/-1}.actions button{width:100%}.parallel{margin-right:14px}}
</style>
</head>
<body>
<div class="shell">
  <div class="lab"><b>Authority Journey — FIELD v3.2</b><span>Low-fi · tests counterfactual → allocation delta</span></div>
  <div class="progress"><i id="bar"></i></div>
  <main id="app"></main>
  <section class="tester"><details><summary>מצב בודק — לא חלק מהמוצר</summary><p>ההמלצות כאן scripted. המטרה היא לבדוק אם ה-before/after והקצאת המשאבים מובנים. ערך אסטרטגי אישי אמיתי ייבדק ב-Wizard-of-Oz.</p><select id="scenario"><option value="expert">מומחה עם ניסיון, מעט נראות</option><option value="referral">יועץ שחי מהפניות</option><option value="newfield">כניסה לתחום חדש</option></select><div class="actions"><button class="secondary" id="sample">מלא תוכנית דוגמה</button><button class="secondary" id="restart">התחל מחדש</button><button class="secondary" id="copy">העתק יומן ניסוי</button></div></details></section>
</div>
<script>
const S={
expert:{domain:'ייעוץ תפעולי לעסקים',diag:'הפער המרכזי שלך אינו ניסיון. הוא שהשוק עדיין לא יכול לראות את המתודולוגיה שמאחורי התוצאות שלך.',add:'לחלץ מתודולוגיה שחוזרת בשלושה מקרים אמיתיים',addHours:5,map:[['available','חילוץ מתודולוגיה משלושה מקרים'],['parallel','בניית case study'],['parallel','יישור הפרופיל לאותה מומחיות'],['blocked','נכס דגל שמציג את השיטה'],['premature','פנייה לבמות לפני שיש נכס דגל']],sample:[['לפרסם 12 פוסטים',20,0,4],['לפתוח פודקאסט',15,2000,3],['לשכתב את האתר',10,0,4]],learn:'אותו סדר אבחון חזר בשלושת המקרים.',changed:'נכס הדגל עבר מ״חסום״ ל״זמין״; פודקאסט עדיין מוקדם מדי.'},
referral:{domain:'ייעוץ אסטרטגי',diag:'לפני שבונים מותג חדש, צריך להבין איזו אוטוריטה כבר קיימת אצלך ולמה אנשים מפנים אליך.',add:'לשחזר את חמש ההפניות האחרונות ואת השפה שבה תיארו אותך',addHours:4,map:[['available','ניתוח 5 נתיבי הפניה'],['parallel','איסוף שפה ממפנים/לקוחות'],['blocked','הגדרת perceived identity נוכחית'],['blocked','הכרעה: להרחיב או לשנות'],['premature','מיצוב ציבורי חדש לפני שנדע מה עובד']],sample:[['לבנות אסטרטגיית תוכן חדשה',16,0,4],['לשכתב את ה-About בלינקדאין',6,0,4],['להתחיל ניוזלטר',12,500,3]],learn:'ארבע מחמש ההפניות השתמשו באותה תפיסה: “עושה סדר לפני שמתחילים לרוץ”.',changed:'הצעד הבא השתנה מהמצאת מיצוב לבדיקת התפיסה הזו מול לקוחות.'},
newfield:{domain:'ייעוץ AI לארגונים',diag:'הדבר שמגביל אותך כרגע אינו visibility. לפני שמגבירים את הקול צריך לבנות authority capital אמיתי בתחום.',add:'לאתר pilot או שיתוף פעולה אחד שמייצר ניסיון אמיתי בתחום היעד',addHours:8,map:[['available','מיפוי מה באמת transferable'],['available','איתור pilot / collaboration'],['parallel','למידה לפי פערי יכולת'],['blocked','case ראשון בתחום'],['premature','להציג מתודולוגיה כ״מוכחת״'],['premature','להרחיב נראות לפני לגיטימציה']],sample:[['לפרסם סדרת פוסטים על AI',18,0,4],['לבנות הרצאה חדשה',12,1000,3],['לשכתב את הפרופיל סביב AI',8,0,4]],learn:'רק אחד משני מקרי הניסיון הסמוך כלל שינוי תהליך ארגוני אמיתי.',changed:'שיתוף פעולה ארגוני עלה בעדיפות מעל סדרת פוסטים.'}
};
const st={step:0,scenario:'expert',domain:'',outcome:'',plan:[],revised:[],learned:false,log:[]};const app=document.querySelector('#app');
function sc(){return S[st.scenario]}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function lg(a,d=''){st.log.push({t:new Date().toISOString(),step:st.step,scenario:st.scenario,a,d})}function go(n){lg('go',n);st.step=n;render();scrollTo({top:0,behavior:'smooth'})}function out(v){return({warm:'פניות חמות',career:'הזדמנויות קריירה',stage:'במות ושיתופי פעולה',influence:'השפעה והכרה'})[v]||'הזדמנויות רלוונטיות'}
function planInputs(){const base=st.plan.length?st.plan:[['',0,0,3],['',0,0,3],['',0,0,3]];return base.map((r,i)=>`<div class="planrow"><div class="actionfield"><label>פעולה ${i+1}<input data-k="action" data-i="${i}" value="${esc(r[0])}" placeholder="מה היית עושה בפועל?"></label></div><label>שעות<input type="number" min="0" data-k="hours" data-i="${i}" value="${r[1]||0}"></label><label>₪<input type="number" min="0" data-k="cash" data-i="${i}" value="${r[2]||0}"></label><label>ביטחון<select data-k="conf" data-i="${i}">${[1,2,3,4,5].map(v=>`<option ${Number(r[3])===v?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}
function capturePlan(){const rows=[0,1,2].map(i=>{const g=k=>document.querySelector(`[data-k="${k}"][data-i="${i}"]`);return [g('action').value.trim(),Number(g('hours').value||0),Number(g('cash').value||0),Number(g('conf').value||3)]}).filter(r=>r[0]);st.plan=rows;lg('counterfactual_captured',JSON.stringify(rows))}
function allocation(){const s=sc(),p=st.plan.length?st.plan:s.sample;const deltas=[];if(p[0])deltas.push({type:'KEEP',cls:'keep',action:p[0][0],hours:p[0][1],cash:p[0][2],why:'יש לפעולה תפקיד, אבל היא לא בהכרח צוואר הבקבוק.'});if(p[1])deltas.push({type:'DELAY',cls:'delay',action:p[1][0],hours:p[1][1],cash:p[1][2],why:'המערכת מדמה dependency שחייב להיסגר קודם.'});if(p[2])deltas.push({type:'REDUCE',cls:'reduce',action:p[2][0],hours:Math.round(p[2][1]/2),cash:Math.round(p[2][2]/2),why:'לא מבטלים, אבל מקטינים הקצאה עד שהפער המרכזי נסגר.'});deltas.push({type:'ADD FIRST',cls:'add',action:s.add,hours:s.addHours,cash:0,why:'זה המהלך שמטפל בפער המרכזי ומגדיל את הערך של הפעולות האחרות.'});return deltas}
function node(t,x){const L={available:'אפשר עכשיו',parallel:'יכול לרוץ במקביל',blocked:'חסום — prerequisite חסר',premature:'מוקדם מדי — לא כדאי עדיין'};return `<div class="node ${t}"><span class="tag">${L[t]}</span><b>${x}</b></div>`}
function render(){document.querySelector('#bar').style.width=Math.min(100,st.step/10*100)+'%';const s=sc();let h='';
if(st.step===0)h=`<section class="panel"><div class="eyebrow">הבעיה היא לא שחסר מה לעשות</div><h1>יש עשרות דרכים לבנות אוטוריטה. השאלה היא איפה לשים את הזמן, הכסף והקשב שלך עכשיו — ומה לא לעשות עדיין.</h1><p class="lead">המוצר אמור לשנות החלטות הקצאה, לא רק לתת לך מפה יפה.</p><div class="actions"><button onclick="go(1)">עזור לי להחליט</button></div></section>`;
if(st.step===1)h=`<section class="panel"><h2>לאן אתה רוצה להגיע?</h2><label>אני רוצה להיות מוכר עבור…<input id="domain" value="${esc(st.domain||s.domain)}"></label><h3 style="margin-top:18px">מה היית רוצה שזה יפתח?</h3>${[['warm','יותר פניות חמות'],['career','הזדמנויות מקצועיות/קריירה'],['stage','במות ושיתופי פעולה'],['influence','השפעה והכרה מקצועית']].map(x=>`<button class="choice outcome" data-v="${x[0]}"><strong>${x[1]}</strong></button>`).join('')}</section>`;
if(st.step===2)h=`<section class="panel"><div class="eyebrow">לפני שאני ממליץ משהו</div><h2>אם המוצר הזה לא היה קיים — מה היית עושה ב־30 הימים הקרובים?</h2><p class="muted">כתוב את הפעולות שאתה באמת שוקל. שעות וכסף יכולים להיות הערכה גסה. אל תנסה לנחש מה “נכון”.</p>${planInputs()}<div class="warning small">זהו stated counterfactual: מה שאתה אומר שהיית עושה. הוא נשמר כ-before-state, לא כעובדה על עתיד שלא קרה.</div><div class="actions"><button id="capture">זה מה שהייתי עושה</button></div></section>`;
if(st.step===3)h=`<section class="panel"><h2>עכשיו צריך רק מידע שיכול לשנות את התוכנית.</h2><p>בחר דרך אחת להתחיל להבין את נקודת הפתיחה.</p><button class="choice source"><strong>LinkedIn / אתר</strong><span>יכול לבדוק אם visibility / positioning באמת צוואר הבקבוק.</span></button><button class="choice source"><strong>קו״ח / ניסיון</strong><span>יכול לחשוף נכסים שאתה לא מקצה אליהם משאבים כרגע.</span></button><button class="choice source"><strong>פשוט תשאל אותי</strong><span>יכול לחלץ מתודולוגיה או ניסיון שלא נכתב.</span></button><button class="choice source"><strong>חקר ציבורי</strong><span>יכול להשוות בין מה שאתה רוצה להיות מוכר עבורו לבין מה שכבר נראה מבחוץ.</span></button></section>`;
if(st.step===4)h=`<section class="panel"><div class="eyebrow">אבחון מדומה לצורך FIELD</div><h2>${s.diag}</h2><p class="muted">בגרסה הזו האבחון scripted. אנחנו בודקים אם השינוי בתוכנית ברור — לא אם האבחון באמת נכון עבורך.</p><div class="actions"><button onclick="go(5)">מה זה משנה בתוכנית שלי?</button></div></section>`;
if(st.step===5){const d=allocation();const movedHours=d.filter(x=>['DELAY','REDUCE'].includes(x.type)).reduce((a,x)=>a+x.hours,0);const movedCash=d.filter(x=>['DELAY','REDUCE'].includes(x.type)).reduce((a,x)=>a+x.cash,0);h=`<section class="panel"><div class="eyebrow">Allocation Delta</div><h2>הערך נמדד מול מה שהתכוונת לעשות — לא מול checklist אידיאלי.</h2><div class="baseline"><b>לפני:</b>${(st.plan.length?st.plan:s.sample).map(r=>`<p>${esc(r[0])} · ${r[1]} שעות${r[2]?` · ₪${r[2]}`:''}</p>`).join('')}</div>${d.map(x=>`<div class="delta ${x.cls}"><span class="tag">${x.type}</span><b>${esc(x.action)}</b><p>${x.why}</p>${x.hours||x.cash?`<span class="small">הקצאה משויכת: ${x.hours||0} שעות${x.cash?` · ₪${x.cash}`:''}</span>`:''}</div>`).join('')}<div class="allocation-summary"><b>לא “חסכנו”:</b> כרגע ${movedHours} שעות${movedCash?` ו־₪${movedCash}`:''} <b>זזו מהקצאה קודמת</b>. רק evidence מאוחר יותר יכול להצדיק לקרוא לזה חיסכון.</div><div class="actions"><button onclick="go(6)">תראה לי למה</button></div></section>`}
if(st.step===6)h=`<section class="panel"><div class="eyebrow">המפה מסבירה את ההקצאה</div><h2>מה אפשר עכשיו, מה במקביל, מה חסום ומה מוקדם מדי.</h2>${s.map.map(n=>node(n[0],n[1])).join('')}<div class="actions"><button onclick="go(7)">מה מקבל משאבים ראשון?</button></div></section>`;
if(st.step===7)h=`<section class="panel"><div class="eyebrow">הקצאה ראשונה</div><h2>${s.add}</h2><p><b>למה:</b> זה המהלך שמטפל בפער שאובחן ומשנה את הערך של פעולות אחרות.</p><p><b>הקצאה מדומה:</b> כ־${s.addHours} שעות לפני שמגדילים השקעה בפעולות אחרות.</p><div class="actions"><button onclick="go(8)">נניח שביצעתי</button></div></section>`;
if(st.step===8)h=`<section class="panel"><div class="eyebrow">evidence חדש</div><h2>המערכת לא אמורה להגן על ההמלצה הקודמת.</h2><div class="panel soft"><b>מה למדנו</b><p>${s.learn}</p></div>${st.learned?`<div class="summary"><b>הקצאה חדשה:</b> ${s.changed}</div>`:''}<div class="actions">${st.learned?'<button onclick="go(9)">סיום</button>':'<button id="learn">עדכן את ההקצאה</button>'}</div></section>`;
if(st.step===9)h=`<section class="panel"><div class="eyebrow">Recall — בלי לחזור למסכים</div><h1>מה השתנה בהחלטה שלך?</h1><ol class="recall"><li>מה אמרת שהיית עושה בלי המוצר?</li><li>מה המערכת שינתה: KEEP / REDUCE / DELAY / ADD?</li><li>איפה עברו שעות/כסף?</li><li>למה אסור לקרוא לזה עדיין “חיסכון”?</li><li>מה המהלך הראשון ולמה?</li><li>מה במקביל, חסום ומוקדם מדי?</li><li>איזה evidence צריך לשנות את ההקצאה שוב?</li></ol><p class="muted">הבודק רושם טעויות הבנה לפני ציונים.</p></section>`;
app.innerHTML=h;bind()}
function bind(){document.querySelectorAll('.outcome').forEach(b=>b.onclick=()=>{st.domain=document.querySelector('#domain').value.trim();st.outcome=b.dataset.v;lg('goal',{domain:st.domain,outcome:st.outcome});go(2)});document.querySelector('#capture')?.addEventListener('click',()=>{capturePlan();if(!st.plan.length){alert('צריך לפחות פעולה אחת שהיית באמת שוקל.');return}go(3)});document.querySelectorAll('.source').forEach(b=>b.onclick=()=>{lg('source',b.innerText);go(4)});document.querySelector('#learn')?.addEventListener('click',()=>{st.learned=true;lg('reallocation_update');render()})}
function setSample(){st.plan=sc().sample.map(x=>[...x]);st.step=2;render()}
document.querySelector('#scenario').onchange=e=>{st.scenario=e.target.value;st.step=0;st.domain='';st.outcome='';st.plan=[];st.learned=false;lg('scenario',st.scenario);render()};document.querySelector('#sample').onclick=setSample;document.querySelector('#restart').onclick=()=>{st.step=0;st.domain='';st.outcome='';st.plan=[];st.learned=false;lg('restart');render()};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(st.log,null,2));alert('יומן הניסוי הועתק')};render();
</script>
</body>
</html>
