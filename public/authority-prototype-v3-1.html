<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Authority Journey v3.1 — FIELD</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;background:#f6f6f3;color:#171717;line-height:1.5}*{box-sizing:border-box}body{margin:0}.shell{max-width:900px;margin:auto;padding:22px 16px 72px}.lab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #bbb;padding:8px 0 14px;margin-bottom:28px;font-size:12px;color:#666}.progress{height:4px;background:#ddd;margin-bottom:26px}.progress i{height:100%;display:block;background:#222}.panel{background:#fff;border:2px solid #222;padding:28px;margin-bottom:14px}.soft{border:1px solid #aaa}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:#666;margin-bottom:8px}h1{font-size:34px;line-height:1.12;margin:0 0 14px}h2{font-size:25px;line-height:1.2;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0 14px}.lead{font-size:19px}.muted{color:#666}.small{font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button{font:inherit;font-weight:700;padding:11px 15px;border:2px solid #222;background:#222;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#222}button.choice{display:block;width:100%;text-align:right;background:#fff;color:#222;padding:15px;margin:8px 0}button.choice strong,button.choice span{display:block}button.choice span{font-weight:400;color:#555;margin-top:3px}.recommended{border-width:3px!important}.tag{display:inline-block;border:1px solid #777;padding:3px 7px;font-size:12px;margin-left:6px}.summary{border-right:5px solid #222;padding-right:14px;margin:18px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.node{border:2px solid #222;padding:13px;margin:8px 0}.parallel{margin-right:28px;border-style:dashed}.blocked{border-color:#999;background:#f1f1ef;color:#666}.premature{border:3px double #888;color:#666}.why{border-top:1px solid #bbb;margin-top:14px;padding-top:14px}.hidden{display:none}.tester{margin-top:40px;border-top:1px dashed #999;padding-top:18px;font-size:13px;color:#666}select,input{width:100%;font:inherit;padding:12px;border:2px solid #222;background:#fff}.tester select{border:1px solid #aaa}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:5px}@media(max-width:650px){.shell{padding:14px 11px 56px}.panel{padding:20px 16px}h1{font-size:29px}.cols{grid-template-columns:1fr}.actions button{width:100%}.parallel{margin-right:14px}}
</style>
</head>
<body>
<div class="shell">
  <div class="lab"><b>Authority Journey — FIELD v3.1</b><span>Low-fi intentionally · tests pain → promise → map</span></div>
  <div class="progress"><i id="bar"></i></div>
  <main id="app"></main>
  <section class="tester"><details><summary>מצב בודק — לא חלק מהמוצר</summary><p>החלפת תרחיש משנה את האבחון והמפה, אבל לא את חוזה ה-UX.</p><select id="scenario"><option value="expert">מומחה עם ניסיון, מעט נראות</option><option value="referral">יועץ שחי מהפניות</option><option value="newfield">כניסה לתחום חדש</option></select><div class="actions"><button class="secondary" id="restart">התחל מחדש</button><button class="secondary" id="copy">העתק יומן ניסוי</button></div></details></section>
</div>
<script>
const S={
expert:{domain:'ייעוץ תפעולי לעסקים',signal:'יש ניסיון ותוצאות, אבל קשה להבין מבחוץ מה השיטה שחוזרת מאחוריהם.',aud:[{role:'המסלול הטבעי',name:'בעלי עסקים עם צווארי בקבוק תפעוליים',why:'הניסיון הקיים כבר מדבר ישירות לבעיה שלהם.',trade:'מרחק אמון קצר יחסית, שוק צפוף.'},{role:'המסלול העסקי',name:'מנכ״לים של חברות שירות קטנות-בינוניות',why:'ערך פוטנציאלי גבוה יותר, אבל הם יצטרכו לראות שיטה והוכחות ברמה ארגונית.',trade:'פוטנציאל גבוה, פער אמון גדול יותר.'},{role:'המסלול המהיר',name:'קהילות מקצועיות שכבר מכירות אותך',why:'כבר קיים הקשר ואמון בסיסי.',trade:'מהיר יותר, אך מצומצם.'}],diag:'הפער המרכזי שלך אינו ניסיון. הוא שהשוק עדיין לא יכול לראות את המתודולוגיה שמאחורי התוצאות שלך.',adv:'יש מספיק עבודה אמיתית כדי לחלץ ממנה שיטה והוכחות.',first:'לחלץ את המתודולוגיה שחוזרת בשלושה מקרים אמיתיים.',why:'אם נגדיל נראות קודם, יותר אנשים יראו אותך — אבל עדיין לא ידעו עבור מה לזכור אותך.',unlock:'אחר כך אפשר לבנות נכס דגל, ליישר את הפרופיל ולבחור במות הפצה.',map:[['available','חילוץ מתודולוגיה משלושה מקרים'],['parallel','בניית case study'],['parallel','יישור הפרופיל לאותה מומחיות'],['blocked','נכס דגל שמציג את השיטה'],['premature','פנייה לבמות לפני שיש נכס דגל']],ask:'שלושה מקרים אמיתיים יאפשרו לבדוק אם השיטה חוזרת — במקום להמציא framework יפה.',learn:'אותו סדר אבחון חזר בשלושת המקרים.',changed:'נכס הדגל עבר מ״חסום״ ל״זמין״.'},
referral:{domain:'ייעוץ אסטרטגי',signal:'רוב העבודה מגיעה מהפניות. ייתכן שכבר קיימת אוטוריטה חזקה — אבל בתוך רשת פרטית.',aud:[{role:'המסלול הטבעי + המהיר',name:'המעגל השני של רשת המפנים הקיימת',why:'גם ההתאמה לנכסים וגם המרחק לאמון חזקים כאן. אין צורך להמציא שלוש אפשרויות.',trade:'מהיר וטבעי יחסית, תלוי במתווכים.'},{role:'המסלול העסקי',name:'מנכ״לים מעבר לרשת הקיימת',why:'פוטנציאל גבוה, אך צריך להבין איך להעביר את האמון גם בלי מפנה.',trade:'שוק גדול יותר, גשר אמון ארוך יותר.'}],diag:'לפני שבונים מותג חדש, צריך להבין איזו אוטוריטה כבר קיימת אצלך ולמה אנשים מפנים אליך.',adv:'יש אות שוק חזק: אנשים מסכנים את המוניטין שלהם ומפנים אליך אחרים.',first:'לשחזר את חמש ההפניות האחרונות ולחלץ את השפה שבה תיארו אותך.',why:'מיצוב חדש לפני שנדע איך השוק כבר מתאר אותך עלול למחוק נכס קיים.',unlock:'אחר כך אפשר להכריע אם להרחיב את התפיסה הקיימת או לשנות אותה.',map:[['available','ניתוח 5 נתיבי הפניה'],['parallel','איסוף השפה של מפנים/לקוחות'],['blocked','הגדרת perceived identity נוכחית'],['blocked','הכרעה: להרחיב או לשנות'],['premature','מיצוב ציבורי חדש לפני שנדע מה עובד']],ask:'מי הפנה את חמשת הלקוחות האחרונים ומה נאמר בפנייה יאפשר לבדוק עבור מה השוק כבר סומך עליך.',learn:'ארבע מחמש הפניות השתמשו באותה תפיסה: “עושה סדר לפני שמתחילים לרוץ”.',changed:'הצעד הבא השתנה מהמצאת מיצוב לבדיקת התפיסה הזו מול לקוחות.'},
newfield:{domain:'ייעוץ AI לארגונים',signal:'יש ניסיון סמוך, אבל מעט עבודה ישירה בתחום היעד. הפער כרגע הוא לגיטימציה יותר מאשר אריזה.',aud:[{role:'המסלול הטבעי',name:'ארגונים שבהם הניסיון הקודם שלך יוצר גשר אמין',why:'אפשר להעביר יכולות רלוונטיות בלי לטעון לניסיון שאין.',trade:'אמין יותר, שוק התחלתי צר.'},{role:'המסלול העסקי',name:'מנהלים בעלי תקציב הטמעת AI',why:'ערך מסחרי גבוה, אך כרגע חסרות הוכחות ישירות.',trade:'פוטנציאל גבוה, מסלול ארוך.'},{role:'המסלול המהיר',name:'שותפים שכבר פועלים בתחום',why:'שיתוף פעולה יכול לייצר ניסיון ולגיטימציה אמיתיים לפני נראות רחבה.',trade:'פחות עצמאות בתחילת הדרך, יותר אמינות.'}],diag:'הדבר שמגביל אותך כרגע אינו visibility. לפני שמגבירים את הקול צריך לבנות authority capital אמיתי בתחום.',adv:'יש ניסיון סמוך שאפשר להפוך לגשר, אם נגדיר מה באמת transferable.',first:'לבחור pilot או שיתוף פעולה אחד שמייצר ניסיון אמיתי בתחום היעד.',why:'עוד תוכן יכול לגרום לך להיראות פעיל, אבל לא פותר את פער ההוכחה.',unlock:'אחרי עבודה אמיתית אפשר לבנות case, לבחון מתודולוגיה ולהרחיב מיצוב.',map:[['available','מיפוי מה באמת transferable'],['available','איתור pilot / collaboration'],['parallel','למידה לפי פערי יכולת'],['blocked','case ראשון בתחום'],['premature','להציג מתודולוגיה כ״מוכחת״'],['premature','להרחיב נראות לפני לגיטימציה']],ask:'שני מקרים מהניסיון הקודם יאפשרו להבדיל בין ניסיון שעובר לתחום החדש לבין דמיון שטחי.',learn:'רק אחד משני המקרים כלל שינוי תהליך ארגוני אמיתי.',changed:'שיתוף פעולה ארגוני עלה בעדיפות מעל סדרת פוסטים.'}
};
const st={step:0,scenario:'expert',domain:'',outcome:'',aud:0,why:false,learned:false,log:[]};
const app=document.querySelector('#app');
function sc(){return S[st.scenario]}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function lg(a,d=''){st.log.push({t:new Date().toISOString(),step:st.step,scenario:st.scenario,a,d})}function go(n){lg('go',n);st.step=n;render();scrollTo({top:0,behavior:'smooth'})}function out(v){return({warm:'פניות חמות',career:'הזדמנויות קריירה',stage:'במות ושיתופי פעולה',influence:'השפעה והכרה'})[v]||'הזדמנויות רלוונטיות'}
function node(t,x){const L={available:'אפשר עכשיו',parallel:'יכול לרוץ במקביל',blocked:'חסום — prerequisite חסר',premature:'מוקדם מדי — לא כדאי עדיין'};return `<div class="node ${t}"><span class="tag">${L[t]}</span><b>${x}</b></div>`}
function render(){document.querySelector('#bar').style.width=Math.min(100,st.step/12*100)+'%';const s=sc();let h='';
if(st.step===0)h=`<section class="panel"><div class="eyebrow">אם כבר ברור לך שאוטוריטה חשובה — אבל לא ברור מה נכון לעשות</div><h1>יש עשרות דרכים לבנות אוטוריטה. הבעיה היא לדעת איזו מהן נכונה לך — ומה צריך לקרות קודם.</h1><p class="lead">במקום עוד רשימת טקטיקות, המטרה כאן היא לבנות מסלול שמתחיל ממה שכבר יש לך ומהשוק שבו אתה רוצה להתברג.</p><div class="actions"><button id="recognize">בנה לי את המסלול</button><button class="secondary" id="notme">זה לא הכאב שלי</button></div></section>`;
if(st.step===1)h=`<section class="panel"><div class="eyebrow">מה המערכת אמורה לפתור</div><h2>ננסה להבין איפה אתה נמצא, מה באמת חסר, ומה הצעד בעל המינוף הגבוה ביותר עבורך.</h2><p class="muted">לא צריך לבחור framework ולא להכין תוכנית מראש.</p><h3>אני רוצה להתברג כאוטוריטה בתחום ה…</h3><input id="domain" value="${esc(st.domain||s.domain)}"><div class="actions"><button id="domainGo">המשך</button></div></section>`;
if(st.step===2)h=`<section class="panel"><h2>מה היית רוצה שהמעמד הזה יפתח עבורך?</h2><p class="muted">אנחנו שואלים רק כי התשובה יכולה לשנות את המסלול.</p>${[['warm','יותר פניות חמות'],['career','הזדמנויות מקצועיות/קריירה'],['stage','במות ושיתופי פעולה'],['influence','השפעה והכרה מקצועית']].map(x=>`<button class="choice outcome" data-v="${x[0]}"><strong>${x[1]}</strong></button>`).join('')}</section>`;
if(st.step===3)h=`<section class="panel"><h2>תן לי דרך אחת להבין מאיפה אתה מתחיל.</h2><p>לא צריך תיק חומרים. כל מקור פותח סוג אחר של הבנה.</p><button class="choice source" data-v="linkedin"><strong>LinkedIn / אתר</strong><span>כדי לראות מה אתה כבר משדר החוצה.</span></button><button class="choice source" data-v="cv"><strong>קו״ח / מסמך ניסיון</strong><span>כדי למצוא ניסיון שעוד לא הפך לנכס.</span></button><button class="choice source" data-v="interview"><strong>פשוט תשאל אותי</strong><span>כדי לחלץ ניסיון ומתודולוגיה שלא נכתבו.</span></button><button class="choice source" data-v="public"><strong>חקור את הנוכחות הציבורית שלי</strong><span>כדי להשוות בין מה שאני רוצה לשדר למה שכבר נראה מבחוץ.</span></button></section>`;
if(st.step===4)h=`<section class="panel"><div class="eyebrow">שחזור נקודת פתיחה</div><h2>אני משווה בין מה שכבר יש לך לבין מה שהתחום דורש.</h2><div class="cols"><div class="panel soft"><h3>עליך</h3><p>${s.signal}</p><p class="small muted">ניסיון · מתודולוגיה · הוכחות · קשרים · איך מגיעים אליך</p></div><div class="panel soft"><h3>על השדה</h3><p>מי כבר נתפס כאוטוריטה, עבור מה, מול מי, ובאילו ערוצים.</p><p class="small muted">נורמות · בידול · קהלים · מתווכים · מסלולים מקבילים</p></div></div><div class="summary"><b>יש מספיק מידע כדי להשוות מסלולי קהל ראשונים.</b></div><button onclick="go(5)">הצג את ההמלצה</button></section>`;
if(st.step===5)h=`<section class="panel"><div class="eyebrow">השורה התחתונה</div><h2>אם הייתי בוחר איפה לבנות קודם — הייתי מתחיל כאן.</h2><p class="muted">אם אותו קהל מנצח בכמה שיקולים, לא ממציאים עוד אפשרויות.</p>${s.aud.map((a,i)=>`<button class="choice audience ${i===0?'recommended':''}" data-i="${i}"><span class="tag">${a.role}</span><strong>${a.name}</strong><span>${a.why}</span><span><b>המחיר:</b> ${a.trade}</span>${i===0?'<span><b>← ההמלצה כרגע</b></span>':''}</button>`).join('')}</section>`;
if(st.step===6){const a=s.aud[st.aud];h=`<section class="panel"><div class="eyebrow">הפרויקט שלך</div><h2>${esc(st.domain||s.domain)}</h2><div class="summary"><p><b>להיות מוכר עבור:</b> ${esc(st.domain||s.domain)}</p><p><b>בעיני:</b> ${a.name}</p><p><b>כדי לייצר יותר:</b> ${out(st.outcome)}</p></div><p>מכאן המפה יכולה לצבור מידע וללמוד מה קורה בעולם.</p><label class="check"><input type="checkbox" id="consent"><span>אני מאשר לשמור את המידע והלמידה בפרויקט הזה</span></label><div class="actions"><button id="project">צור פרויקט</button><button class="secondary" onclick="go(5)">שנה מסלול</button></div></section>`}
if(st.step===7)h=`<section class="panel"><div class="eyebrow">מה הכי מגביל אותך כרגע</div><h2>${s.diag}</h2><div class="cols"><div class="panel soft"><h3>מה כבר חזק</h3><p>${s.adv}</p></div><div class="panel soft"><h3>למה זה חשוב</h3><p>אם מטפלים בפער הלא נכון, אפשר לייצר הרבה פעילות בלי להתקרב למעמד הרצוי.</p></div></div><button class="secondary" id="whyBtn">איך בניתם את המפה?</button><div class="why ${st.why?'':'hidden'}" id="why"><p><b>זו פרשנות אסטרטגית.</b> היא נשענת על נכסים קיימים, perceived identity, דרישות השדה והיעד שבחרת. בפרודקשן ההנחות והמקורות צריכים להיות ניתנים לבדיקה.</p></div><div class="actions"><button onclick="go(8)">הצג את הדרך</button></div></section>`;
if(st.step===8)h=`<section class="panel"><div class="eyebrow">Decision-Ready Authority Map</div><h2>מה אפשר עכשיו, מה במקביל, מה חסום ומה מוקדם מדי.</h2>${s.map.map(n=>node(n[0],n[1])).join('')}<div class="actions"><button onclick="go(9)">מה הדבר הראשון?</button></div></section>`;
if(st.step===9)h=`<section class="panel"><div class="eyebrow">הפעולה בעלת המינוף הגבוה</div><h2>${s.first}</h2><p><b>למה עכשיו:</b> ${s.why}</p><p><b>מה זה פותח:</b> ${s.unlock}</p><div class="actions"><button onclick="go(10)">המשך</button></div></section>`;
if(st.step===10)h=`<section class="panel"><div class="eyebrow">עוד מידע רק אם הוא משנה משהו</div><h2>אפשר לחדד את המפה.</h2><p>${s.ask}</p><div class="actions"><button id="add">אתן את המידע</button><button class="secondary" id="skip">לא עכשיו — אפעל לפי המפה</button></div></section>`;
if(st.step===11)h=`<section class="panel"><div class="eyebrow">למידה אחרי פעולה בעולם</div><h2>המפה לא אמורה להישאר קבועה.</h2><div class="panel soft"><b>מידע חדש</b><p>${s.learn}</p></div>${st.learned?`<div class="summary"><b>מה השתנה:</b> ${s.changed}</div>`:''}<div class="actions">${st.learned?'<button onclick="go(12)">סיום הניסוי</button>':'<button id="learn">עדכן את המפה</button>'}</div></section>`;
if(st.step===12)h=`<section class="panel"><div class="eyebrow">בדיקת recall — בלי לחזור למסכים</div><h1>אל תשאל אם זה “מעניין”. בדוק מה נשאר.</h1><ol><li>מה הכאב שהמוצר מנסה לפתור?</li><li>מה הוא מבטיח לתת?</li><li>עבור מה רצית להיות מוכר ומול מי?</li><li>מה היה הפער המרכזי?</li><li>מה היית עושה עכשיו?</li><li>למה זה קודם לדברים אחרים?</li><li>מה יכול לקרות במקביל?</li><li>מה חסום ומה מוקדם מדי?</li><li>למה שווה לתת את פיסת הדאטה הבאה?</li><li>למה המפה השתנתה?</li></ol><p class="muted">לבודק: רשום טעויות הבנה והצלה לפני ציונים.</p></section>`;
app.innerHTML=h;bind()}
function bind(){document.querySelector('#recognize')?.addEventListener('click',()=>{lg('pain_recognized');go(1)});document.querySelector('#notme')?.addEventListener('click',()=>{lg('pain_rejected');alert('סומן: הטריגר לא תואם למשתמש הזה. זה נתון, לא כשל שיש לעקוף.');});document.querySelector('#domainGo')?.addEventListener('click',()=>{st.domain=document.querySelector('#domain').value.trim();lg('domain');go(2)});document.querySelectorAll('.outcome').forEach(b=>b.onclick=()=>{st.outcome=b.dataset.v;lg('outcome',st.outcome);go(3)});document.querySelectorAll('.source').forEach(b=>b.onclick=()=>{lg('source',b.dataset.v);go(4)});document.querySelectorAll('.audience').forEach(b=>b.onclick=()=>{st.aud=Number(b.dataset.i);lg('audience',st.aud);go(6)});document.querySelector('#project')?.addEventListener('click',()=>{if(!document.querySelector('#consent').checked){lg('consent_block');alert('סמן אישור כדי להמשיך בניסוי המצטבר.');return}lg('consent');go(7)});document.querySelector('#whyBtn')?.addEventListener('click',()=>{st.why=!st.why;lg('why',st.why);render()});document.querySelector('#add')?.addEventListener('click',()=>{lg('data_accept');go(11)});document.querySelector('#skip')?.addEventListener('click',()=>{lg('data_skip');go(11)});document.querySelector('#learn')?.addEventListener('click',()=>{st.learned=true;lg('replan');render()})}
document.querySelector('#scenario').onchange=e=>{st.scenario=e.target.value;st.step=0;st.domain='';st.outcome='';st.aud=0;st.why=false;st.learned=false;lg('scenario',st.scenario);render()};document.querySelector('#restart').onclick=()=>{st.step=0;st.domain='';st.outcome='';st.aud=0;st.why=false;st.learned=false;lg('restart');render()};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(st.log,null,2));alert('יומן הניסוי הועתק')};render();
</script>
</body>
</html>
