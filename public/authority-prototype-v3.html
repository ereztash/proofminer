<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Authority Journey v3 — Low-fi field prototype</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;background:#f7f7f5;color:#171717;line-height:1.5}*{box-sizing:border-box}body{margin:0}.shell{max-width:920px;margin:auto;padding:24px 18px 80px}.testbar{font-size:12px;color:#666;border-bottom:1px solid #ccc;padding:8px 0 14px;margin-bottom:30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:700}.stepcount{font-size:13px;color:#666;margin-bottom:8px}.panel{background:#fff;border:2px solid #222;padding:28px;margin-bottom:16px}.panel.soft{border:1px solid #aaa}.panel.dashed{border:1px dashed #777}.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#666;margin-bottom:8px}h1{font-size:32px;line-height:1.15;margin:0 0 14px}h2{font-size:25px;line-height:1.2;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0 14px}.lead{font-size:19px}.muted{color:#666}.small{font-size:13px}.question{font-size:21px;font-weight:700;margin:20px 0 12px}input,textarea,select{width:100%;font:inherit;padding:13px;border:2px solid #222;background:#fff}textarea{min-height:110px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;font-weight:700;padding:11px 16px;border:2px solid #222;background:#222;color:white;cursor:pointer}button.secondary{background:#fff;color:#222}button.quiet{border:1px solid #aaa;background:#fff;color:#555;font-weight:400}.choices{display:grid;gap:10px}.choice{display:block;width:100%;text-align:right;background:white;color:#222;border:2px solid #222;padding:16px}.choice strong{display:block;margin-bottom:3px}.choice span{display:block;font-weight:400;color:#555}.choice.recommended{border-width:3px}.tag{display:inline-block;border:1px solid #777;padding:3px 7px;font-size:12px;margin-left:5px}.route{display:grid;gap:10px;margin:18px 0}.node{border:2px solid #222;padding:14px;background:#fff}.node.parallel{margin-right:32px;border-style:dashed}.node.blocked{border-color:#999;color:#666;background:#f1f1ef}.node.done{border-color:#777;text-decoration:none;background:#eee}.arrow{padding-right:22px;color:#666}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{border-right:5px solid #222;padding-right:14px;margin:18px 0}.hidden{display:none!important}.why{margin-top:12px;border-top:1px solid #bbb;padding-top:12px}.toast{position:fixed;bottom:16px;left:16px;background:#222;color:#fff;padding:10px 14px;font-size:13px;display:none}.tester{margin-top:48px;border-top:1px dashed #aaa;padding-top:20px}.tester details{font-size:13px;color:#555}.tester select{border:1px solid #aaa;margin:8px 0}.signal{padding:12px;border:1px solid #777;background:#fafafa;margin:8px 0}.unlock{border:2px dashed #222;padding:16px;margin-top:16px}.progressline{height:4px;background:#ddd;margin-bottom:28px}.progressline i{display:block;height:100%;background:#222;width:0}.nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.nav span{border:1px solid #aaa;padding:6px 10px;font-size:13px}.nav .active{border:2px solid #222;font-weight:700}@media(max-width:650px){.shell{padding:14px 12px 60px}.panel{padding:20px 16px}h1{font-size:28px}.columns{grid-template-columns:1fr}.actions button{width:100%}.node.parallel{margin-right:16px}}
</style>
</head>
<body>
<div class="shell">
  <div class="testbar"><span class="brand">Authority Journey — FIELD prototype v3</span><span>Low fidelity intentionally · no AI · no scoring</span></div>
  <div class="progressline"><i id="progress"></i></div>
  <main id="app"></main>

  <section class="tester">
    <details>
      <summary>מצב בודק — לא חלק מהמוצר</summary>
      <p>הפרוטוטייפ משתמש בשלושה מצבים שונים כדי לבדוק אם אותה חוויה יכולה להחזיק מסלולים שונים, בלי לכתוב שלוש אפליקציות.</p>
      <label>תרחיש ניסוי</label>
      <select id="scenarioSelect">
        <option value="expert">מומחה חזק, מעט נראות</option>
        <option value="referral">יועץ שמקבל לקוחות מהפניות</option>
        <option value="newfield">מעבר לתחום חדש עם מעט לגיטימציה</option>
      </select>
      <div class="actions">
        <button class="quiet" id="restart">התחל מחדש בתרחיש</button>
        <button class="quiet" id="copylog">העתק יומן ניסוי</button>
      </div>
      <p class="small">היומן נשמר רק בדפדפן הזה וכולל צעדים/בחירות, לא תוכן אישי שהוקלד.</p>
    </details>
  </section>
</div>
<div class="toast" id="toast">הועתק</div>
<script>
const scenarios={
 expert:{
  domain:'ייעוץ תפעולי לעסקים',
  publicSignal:'יש ניסיון ותוצאות, אבל כמעט אין דרך ציבורית להבין את השיטה שמאחוריהם.',
  audience:[
   {role:'המסלול הטבעי',name:'בעלי עסקים שכבר חווים צווארי בקבוק תפעוליים',why:'הניסיון והדוגמאות הקיימות שלך כבר מדברות ישירות לכאב שלהם.',trade:'קל יחסית לבסס אמון; השוק צפוף.'},
   {role:'המסלול העסקי',name:'מנכ״לים של חברות שירות קטנות-בינוניות',why:'ערך עסקה גבוה יותר, אבל הם יצטרכו לראות שיטה והוכחות שנראות מעבר לעסק קטן.',trade:'פוטנציאל גבוה; פער אמון גדול יותר.'},
   {role:'המסלול המהיר',name:'קהילות מקצועיות שבהן כבר מכירים אותך',why:'כבר קיים הקשר ואמון בסיסי, ולכן המרחק להכרה כמומחה קצר יותר.',trade:'מהיר, אך שוק מצומצם יותר.'}
  ],
  diagnosis:'הפער המרכזי שלך אינו ניסיון. הוא שהשוק לא יכול כרגע לראות את המתודולוגיה שמאחורי התוצאות שלך.',
  advantage:'יש לך מספיק עבודה אמיתית כדי לחלץ ממנה שיטה והוכחות.',
  first:'לחלץ את המתודולוגיה שחוזרת בשלושה מקרים אמיתיים.',
  whyFirst:'אם נגדיל נראות לפני שהשיטה נעשית ברורה, יותר אנשים יראו אותך — אבל לא בהכרח ידעו עבור מה לזכור אותך.',
  unlock:'אחרי זה אפשר לבנות נכס דגל, לתקן את הפרופיל ולבחור במות הפצה בצורה עקבית.',
  map:[
    ['available','חילוץ מתודולוגיה משלושה מקרים'],
    ['parallel','בניית case study מבוסס'],
    ['parallel','תיקון פרופיל כך שישקף את אותה התמחות'],
    ['blocked','נכס דגל שמציג את השיטה'],
    ['blocked','פנייה לפודקאסטים/במות רלוונטיות']
  ],
  dataAsk:'הוסף 3 דוגמאות של לקוחות/פרויקטים. זה יאפשר לבדוק אילו מהלכים שלך באמת חוזרים — במקום להמציא framework יפה.',
  learning:'אחרי שלושה מקרים, אותו סדר אבחון חזר בכולם. המתודולוגיה כבר פחות היפותזה ויותר דפוס נתמך.',
  changed:'המפה השתנתה: “נכס דגל” עבר מחסום ל־זמין עכשיו.'
 },
 referral:{
  domain:'ייעוץ אסטרטגי',
  publicSignal:'רוב העבודה מגיעה מהפניות. כלומר ייתכן שכבר קיימת אוטוריטה — רק בתוך רשת פרטית ולא בפרופיל הציבורי.',
  audience:[
   {role:'המסלול הטבעי',name:'המעגל השני של רשת המפנים הקיימת',why:'כבר קיים מנגנון אמון שמייצר עבודה בפועל.',trade:'הרחבה טבעית; תלויה במספר קטן של מתווכים.'},
   {role:'המסלול העסקי',name:'מנכ״לים בחברות שירות',why:'מתאים לערך העבודה, אך לא ברור עדיין מה גורם להם לבחור דווקא בך.',trade:'פוטנציאל גבוה; צריך לקודד את סיבת האמון.'},
   {role:'המסלול המהיר',name:'קהילות שבהן המפנים שלך כבר מוכרים',why:'אפשר להעביר חלק מהאמון דרך אנשים שכבר נתפסים כלגיטימיים.',trade:'מהיר יחסית; תלוי בנכונות המפנים לפעול.'}
  ],
  diagnosis:'לפני שאתה בונה “מותג חדש”, כדאי להבין איזו אוטוריטה כבר קיימת אצלך ולמה אנשים מפנים אליך.',
  advantage:'יש אות שוק חזק: אנשים מסכנים את המוניטין שלהם ומפנים אליך אחרים.',
  first:'לשחזר את חמש ההפניות האחרונות ולחלץ את השפה שבה תיארו אותך.',
  whyFirst:'אם נכתוב positioning לפני שנבדוק איך השוק כבר מתאר אותך, אנחנו עלולים למחוק נכס שקיים בלי לדעת.',
  unlock:'אחרי זה אפשר לבחור אם להרחיב את אותה תפיסה או לשנות אותה במכוון.',
  map:[
    ['available','ניתוח 5 נתיבי הפניה אחרונים'],
    ['parallel','איסוף שפה מלקוחות/מפנים'],
    ['blocked','הגדרת perceived identity נוכחית'],
    ['blocked','הכרעה: להרחיב או לשנות את הזהות'],
    ['blocked','תרגום למיצוב ציבורי ולנכסים']
  ],
  dataAsk:'הוסף מי הפנה את חמשת הלקוחות האחרונים ומה נאמר בפנייה. זה יאפשר לבדוק עבור מה השוק כבר סומך עליך.',
  learning:'ארבע מתוך חמש הפניות תיארו אותך כמי שיודע “לעשות סדר לפני שמתחילים לרוץ”.',
  changed:'המפה השתנתה: במקום להמציא category חדש, הפעולה הבאה היא לבדוק אם הביטוי הזה מחזיק גם אצל הלקוחות עצמם.'
 },
 newfield:{
  domain:'ייעוץ AI לארגונים',
  publicSignal:'יש ניסיון סמוך, אבל עדיין מעט עבודה ישירה בתחום היעד. הפער המרכזי כרגע הוא לגיטימציה — לא אריזה.',
  audience:[
   {role:'המסלול הטבעי',name:'ארגונים שבהם הניסיון הקודם שלך נותן לך גשר אמין',why:'אפשר לחבר ידע קיים לבעיה חדשה בלי לטעון שכבר יש לך ניסיון שאין לך.',trade:'אמין יותר; שוק ראשוני צר.'},
   {role:'המסלול העסקי',name:'מנהלים בעלי תקציב הטמעת AI',why:'ערך מסחרי גבוה, אבל כרגע חסרות הוכחות ישירות.',trade:'פוטנציאל גבוה; מסלול ארוך יותר.'},
   {role:'המסלול המהיר',name:'שותפים/מומחים שכבר עובדים בתחום ויכולים לשתף פעולה',why:'שיתוף פעולה יכול לייצר עבודה ולגיטימציה אמיתית לפני בניית נראות רחבה.',trade:'פחות עצמאות בתחילת הדרך; יותר אמינות.'}
  ],
  diagnosis:'הדבר שמגביל אותך כרגע אינו visibility. לפני שמגבירים את הקול צריך לבנות יותר authority capital אמיתי בתחום.',
  advantage:'יש לך ניסיון סמוך שאפשר להפוך לגשר — אם נגדיר במדויק מה כן עובר ומה לא.',
  first:'לבחור פרויקט/שיתוף פעולה אחד שמייצר ניסיון אמיתי בתחום היעד.',
  whyFirst:'עוד תוכן יכול לגרום לך להיראות פעיל בתחום, אבל לא פותר את פער ההוכחה וההעברה בין התחומים.',
  unlock:'אחרי עבודה אמיתית אחת אפשר לבחון מתודולוגיה, לבנות case ולהרחיב את המיצוב בבטחה.',
  map:[
    ['available','מיפוי ניסיון סמוך ומה באמת transferable'],
    ['available','איתור pilot / collaboration אמיתי'],
    ['parallel','למידה ממוקדת לפי פערי היכולת'],
    ['blocked','case ראשון בתחום'],
    ['blocked','מתודולוגיה נתמכת'],
    ['blocked','הרחבת distribution והצהרת authority חזקה יותר']
  ],
  dataAsk:'הוסף שני מקרים מהניסיון הקודם שאתה חושב שרלוונטיים. זה יאפשר להבחין בין מה שעובר לתחום החדש לבין מה שרק נשמע דומה.',
  learning:'אחד משני המקרים באמת כולל שינוי תהליך ארגוני; השני הוא בעיקר ידע טכני. רק הראשון נכנס כרגע כגשר לגיטימי.',
  changed:'המפה השתנתה: שיתוף פעולה ארגוני הפך לעדיפות גבוהה יותר מפרסום סדרת פוסטים.'
 }
};
const state={step:0,scenario:'expert',domain:'',outcome:'',input:'',audience:0,showWhy:false,learned:false,log:JSON.parse(localStorage.getItem('authority-prototype-log')||'[]')};
const app=document.querySelector('#app');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function log(action,detail=''){state.log.push({time:new Date().toISOString(),step:state.step,scenario:state.scenario,action,detail});localStorage.setItem('authority-prototype-log',JSON.stringify(state.log))}
function go(n){log('go',String(n));state.step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function progress(){document.querySelector('#progress').style.width=Math.min(100,state.step/9*100)+'%'}
function scenario(){return scenarios[state.scenario]}
function render(){progress();const s=scenario();let h='';
if(state.step===0)h=`<div class="stepcount">התחלה</div><section class="panel"><div class="eyebrow">לא עוד רעיונות לתוכן</div><h1>להפוך את מה שכבר עשית — ואת מה שעוד חסר — למסלול ברור לבניית אוטוריטה.</h1><p class="lead">המטרה היא להבין איפה אתה נמצא, מול מי כדאי לבנות את המעמד הזה, ומה באמת שווה לעשות עכשיו.</p><div class="question">אני רוצה להתברג כאוטוריטה בתחום ה…</div><input id="domain" value="${esc(state.domain||s.domain)}" aria-label="תחום אוטוריטה"><div class="actions"><button id="start">בנה לי נקודת פתיחה</button></div></section>`;
if(state.step===1)h=`<div class="stepcount">1 · למה זה חשוב</div><section class="panel"><div class="eyebrow">רק אם זה משנה את האסטרטגיה</div><h2>מה היית רוצה שהאוטוריטה הזאת תפתח עבורך?</h2><p class="muted">לא “יעד מותג”. מה היית רוצה שיקרה יותר בעולם האמיתי?</p><div class="choices">${[['warm','יותר פניות חמות מלקוחות'],['career','הזדמנויות מקצועיות/קריירה'],['stage','הזמנות לבמות, פודקאסטים או שיתופי פעולה'],['influence','השפעה והכרה מקצועית']].map(x=>`<button class="choice outcome" data-v="${x[0]}"><strong>${x[1]}</strong></button>`).join('')}</div></section>`;
if(state.step===2)h=`<div class="stepcount">2 · נקודת פתיחה</div><section class="panel"><h2>תן לי דרך אחת להבין מאיפה אתה מתחיל.</h2><p>לא צריך להכין תיק חומרים. כל מקור פותח סוג אחר של הבנה.</p><div class="choices"><button class="choice input" data-v="linkedin"><strong>LinkedIn / אתר</strong><span>כדי לראות מה אתה כבר משדר החוצה.</span></button><button class="choice input" data-v="cv"><strong>קו״ח או מסמך ניסיון</strong><span>כדי למצוא ניסיון שאולי עדיין לא הפכת לנכס.</span></button><button class="choice input" data-v="interview"><strong>פשוט תשאל אותי</strong><span>ראיון קצר כדי לחלץ ניסיון ומתודולוגיה שלא נכתבו.</span></button><button class="choice input" data-v="public"><strong>חקור את הנוכחות הציבורית שלי</strong><span>נבקש אישור לפני חיפוש ושמירה.</span></button></div></section>`;
if(state.step===3)h=`<div class="stepcount">3 · שחזור מצב</div><section class="panel"><div class="eyebrow">המערכת עובדת בשני כיוונים</div><h2>אני משווה בין מה שכבר יש לך לבין מה שהתחום דורש.</h2><div class="columns"><div class="panel soft"><h3>עליך</h3><p>${s.publicSignal}</p><p class="small muted">ניסיון · נכסים · מה כבר אומרים עליך · הפניות · מתודולוגיה אפשרית</p></div><div class="panel soft"><h3>על התחום</h3><p>אני מחפש מי כבר נתפס כאוטוריטה, עבור מה, מול אילו קהלים ובאילו במות.</p><p class="small muted">נקודות חובה · בידול · ערוצים · מסלולים מקבילים · פערי שוק</p></div></div><div class="summary"><strong>יש מספיק מידע כדי להשוות בין מסלולי קהל ראשונים.</strong></div><div class="actions"><button onclick="go(4)">הצג את המסלולים</button></div></section>`;
if(state.step===4)h=`<div class="stepcount">4 · בחירת מסלול</div><section class="panel"><div class="eyebrow">השורה התחתונה</div><h2>אם הייתי בוחר איפה לבנות קודם — הייתי מתחיל כאן.</h2><p class="muted">ההמלצה משווה בין מה שכבר יש לך, צורך בשוק, פוטנציאל והמרחק לאמון אמין.</p><div class="choices">${s.audience.map((a,i)=>`<button class="choice aud ${i===0?'recommended':''}" data-i="${i}"><span class="tag">${a.role}</span><strong>${a.name}</strong><span>${a.why}</span><span><b>המחיר:</b> ${a.trade}</span>${i===0?'<span><b>← הייתי מתחיל כאן</b></span>':''}</button>`).join('')}</div></section>`;
if(state.step===5){const a=s.audience[state.audience];h=`<div class="stepcount">5 · הפרויקט שלך</div><section class="panel"><div class="eyebrow">Authority Project</div><h2>${esc(state.domain||s.domain)}</h2><div class="summary"><p><b>להיות מוכר עבור:</b> ${esc(state.domain||s.domain)}</p><p><b>בעיני:</b> ${a.name}</p><p><b>כדי לייצר יותר:</b> ${labelOutcome(state.outcome)}</p></div><p>הפרויקט ישמור את מה שנלמד, את המפה ואת השינויים לאורך הדרך.</p><label class="small"><input id="consent" type="checkbox" style="width:auto"> אני מאשר לשמור את המידע והלמידה בפרויקט הזה</label><div class="actions"><button id="createProject">צור את הפרויקט</button><button class="secondary" onclick="go(4)">שנה מסלול</button></div></section>`}
if(state.step===6)h=`<div class="stepcount">6 · האבחון הראשון</div><section class="panel"><div class="eyebrow">מה הכי מגביל אותך כרגע</div><h2>${s.diagnosis}</h2><div class="columns"><div class="panel soft"><h3>היתרון שכבר יש</h3><p>${s.advantage}</p></div><div class="panel soft"><h3>למה זה משנה</h3><p>אם נטפל בפער הלא נכון, אפשר לייצר הרבה פעילות בלי להתקרב למעמד שאתה רוצה.</p></div></div><button class="quiet" id="toggleWhy">איך בניתם את המפה הזאת?</button><div id="why" class="why ${state.showWhy?'':'hidden'}"><p><b>מאחורי הקלעים:</b> השווינו בין נכסים קיימים, perceived identity, דרישות השדה, מסלולים של מומחים אחרים והיעד שבחרת.</p><p class="small">זו פרשנות אסטרטגית, לא עובדה. בפרודקשן כל מסקנה מהותית צריכה להיות ניתנת לבדיקה מול המקורות וההנחות שלה.</p></div><div class="actions"><button onclick="go(7)">הצג את הדרך</button></div></section>`;
if(state.step===7)h=`<div class="stepcount">7 · המפה</div><div class="nav"><span class="active">המפה</span><span>הנכסים</span><span>התחום</span><span>הלמידה</span></div><section class="panel"><div class="eyebrow">לא checklist</div><h2>מה טורי, מה מקבילי, ומה עדיין מוקדם מדי.</h2><div class="route">${s.map.map((n,i)=>node(n[0],n[1],i)).join('')}</div><div class="actions"><button onclick="go(8)">מה הדבר הראשון?</button></div></section>`;
if(state.step===8)h=`<div class="stepcount">8 · הפעולה בעלת המינוף הגבוה</div><section class="panel"><div class="eyebrow">הדבר שהייתי עושה עכשיו</div><h2>${s.first}</h2><p><b>למה עכשיו:</b> ${s.whyFirst}</p><p><b>מה זה פותח:</b> ${s.unlock}</p><div class="unlock"><h3>אפשר לחדד את ההמלצה</h3><p>${s.dataAsk}</p><div class="actions"><button id="addData">הוסף את המידע הזה</button><button class="secondary" id="skipData">לא עכשיו — התחל מהפעולה</button></div></div></section>`;
if(state.step===9)h=`<div class="stepcount">9 · למידה מהעולם</div><section class="panel"><div class="eyebrow">אחרי פעולה אמיתית</div><h2>המפה לא אמורה להישאר קבועה.</h2><p>בפרוטוטייפ הזה אנחנו מדמים מידע חדש שהגיע אחרי ביצוע הפעולה.</p><div class="signal"><b>מידע חדש</b><p>${s.learning}</p></div>${state.learned?`<div class="panel soft"><div class="eyebrow">מה השתנה</div><h3>${s.changed}</h3><p class="small">זו בדיוק ההיפותזה שצריך לבדוק בשטח: האם שינוי מסלול בעקבות ראיה חדשה מרגיש כמו למידה — או כמו חוסר יציבות.</p></div>`:''}<div class="actions">${state.learned?'<button id="finish">סיים את הניסוי</button>':'<button id="applyLearning">עדכן את המפה לפי המידע</button>'}</div></section>`;
if(state.step===10)h=`<section class="panel"><div class="eyebrow">סיום ניסוי</div><h1>עכשיו לא שואלים “אהבת?”</h1><p class="lead">הבודק צריך לבדוק מה הבנת בלי להסביר לך מחדש את המוצר.</p><ol><li>מה המוצר אמור לעזור לך להשיג?</li><li>למה הומלץ הקהל שבחרת?</li><li>מה הפער המרכזי שזוהה?</li><li>מה הפעולה הראשונה ולמה היא קודמת לאחרות?</li><li>מה יכול לקרות במקביל?</li><li>איזה מידע נוסף שווה לתת למערכת ולמה?</li><li>מה היה כאן נתון ומה הייתה פרשנות?</li><li>למה המפה השתנתה בסוף?</li></ol><p class="muted">לבודק: רשום טעויות הבנה, היסוסים, התנגדויות וחוסר אמון לפני שאתה מבקש ציון.</p><div class="actions"><button onclick="go(0)">התחל תרחיש נוסף</button></div></section>`;
app.innerHTML=h;bind();}
function labelOutcome(v){return ({warm:'פניות חמות',career:'הזדמנויות קריירה',stage:'הזמנות ובמות',influence:'השפעה והכרה מקצועית'})[v]||'הזדמנויות רלוונטיות'}
function node(type,text,i){const labels={available:'אפשר להתחיל עכשיו',parallel:'יכול לרוץ במקביל',blocked:'חסום עד שהקודם נפתח'};return `${i?'<div class="arrow">↓</div>':''}<div class="node ${type}"><span class="tag">${labels[type]}</span><b>${text}</b></div>`}
function bind(){
 document.querySelector('#start')?.addEventListener('click',()=>{state.domain=document.querySelector('#domain').value.trim();log('domain_entered');go(1)});
 document.querySelectorAll('.outcome').forEach(b=>b.onclick=()=>{state.outcome=b.dataset.v;log('outcome_selected',state.outcome);go(2)});
 document.querySelectorAll('.input').forEach(b=>b.onclick=()=>{state.input=b.dataset.v;log('input_selected',state.input);go(3)});
 document.querySelectorAll('.aud').forEach(b=>b.onclick=()=>{state.audience=Number(b.dataset.i);log('audience_selected',String(state.audience));go(5)});
 document.querySelector('#createProject')?.addEventListener('click',()=>{const c=document.querySelector('#consent');if(!c.checked){alert('בפרוטוטייפ אנחנו בודקים גם אם ברור שהפרויקט מצטבר. סמן אישור כדי להמשיך.');log('consent_blocked');return}log('persistence_consented');go(6)});
 document.querySelector('#toggleWhy')?.addEventListener('click',()=>{state.showWhy=!state.showWhy;log('why_toggled',String(state.showWhy));render()});
 document.querySelector('#addData')?.addEventListener('click',()=>{log('data_unlock_accepted');go(9)});
 document.querySelector('#skipData')?.addEventListener('click',()=>{log('data_unlock_skipped');go(9)});
 document.querySelector('#applyLearning')?.addEventListener('click',()=>{state.learned=true;log('learning_applied');render()});
 document.querySelector('#finish')?.addEventListener('click',()=>{log('experiment_finished');go(10)});
}
document.querySelector('#scenarioSelect').onchange=e=>{state.scenario=e.target.value;state.step=0;state.domain='';state.outcome='';state.audience=0;state.learned=false;log('scenario_changed',state.scenario);render()};
document.querySelector('#restart').onclick=()=>{state.step=0;state.domain='';state.outcome='';state.audience=0;state.learned=false;log('restart');render()};
document.querySelector('#copylog').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(state.log,null,2));const t=document.querySelector('#toast');t.style.display='block';setTimeout(()=>t.style.display='none',1300)};
render();
</script>
</body>
</html>
