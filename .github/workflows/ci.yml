name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      # A deployment that cannot name its own commit makes "this commit passed
      # its smoke test" unverifiable. Cheap to assert here, and it fails loudly
      # if the build-identity plugin is ever dropped.
      - name: Build carries its commit
        run: |
          grep -q 'name="proofminer-commit"' dist/index.html \
            || { echo "dist/index.html carries no proofminer-commit meta"; exit 1; }
          grep -q 'content="'"$GITHUB_SHA"'"' dist/index.html \
            || { echo "proofminer-commit does not match GITHUB_SHA ($GITHUB_SHA)"; \
                 grep -o 'proofminer-commit" content="[^"]*"' dist/index.html; exit 1; }
