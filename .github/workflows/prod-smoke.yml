name: Production Smoke

on:
  deployment_status:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-smoke.yml"
      - "tests/e2e/prod-smoke.spec.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel preview or production URL to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-smoke-${{ github.event.deployment_status.deployment.id || github.event.inputs.base_url || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke against deployed app
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Preview deployments are not reachable by this job. The project runs Vercel
    # SSO protection in `all_except_custom_domains` mode, so every preview URL
    # answers with the Vercel login page rather than the app, and all three
    # specs fail against an `<h1>Log in to Vercel</h1>` no matter what the
    # commit changed. Only the assigned production domain is public.
    #
    # Gated on *not preview* rather than on *is production*: if Vercel ever
    # relabels the environment, the wrong guess is a redundant run against
    # production, not a check that silently stops running.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment_status.environment, 'preview'))

    env:
      # Deliberately not `deployment_status.environment_url`: that is the
      # immutable per-deployment URL, which SSO protects even for production.
      # The public alias is the only address a headless browser can read.
      PROOFMINER_BASE_URL: ${{ github.event.inputs.base_url || vars.PROOFMINER_BASE_URL || 'https://proofminer-gamma.vercel.app' }}
      # Asserted only on a deployment_status event, where the commit that was
      # deployed is known. A push fires before Vercel has finished building, and
      # a manual run points at an arbitrary URL, so on both the smoke reports
      # the served commit without asserting it.
      PROOFMINER_EXPECT_COMMIT: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install smoke test dependencies
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.54.2

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify deployed product flow
        run: npm run smoke:prod
